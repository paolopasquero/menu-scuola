<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b4332"><title>Menu scuola</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=4"><link rel="icon" href="icon.svg"></head><body>
<header><h1>🍽️ Menu della scuola</h1><p>Consulta il pranzo e la merenda del giorno</p></header>
<main class="shell"><section class="toolbar"><button id="today" class="primary">Oggi</button><button id="tomorrow">Domani</button><label class="datebox">Scegli una data<input id="date" type="date"></label></section>
<div class="summary"><h2 id="title"></h2><span class="badge" id="week"></span></div><section id="content" class="grid"></section>
<div class="weeknav"><button id="prev">← Giorno prima</button><button id="next">Giorno dopo →</button></div><p class="note">Il menu segue un ciclo continuo di 4 settimane. Gli asterischi riprendono quelli presenti nel menu originale.</p></main>
<script src="menu-data.js?v=4"></script><script src="app.js?v=4"></script></body></html>
